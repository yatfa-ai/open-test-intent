name: CI

on:
  # `pull_request` covers every branch pre-merge; `push` is filtered to `main`
  # so it only adds post-merge coverage. Without the filter every push to a PR
  # branch fires both events over an identical tree, doubling the matrix.
  push:
    branches: [main]
  pull_request:

# This job builds and runs code agents write freely, on runners that receive
# GITHUB_TOKEN. Declaring the scope here means the job cannot inherit a repo/org
# default that an admin may widen to read-write later. `actions/checkout` is the
# only token consumer and needs nothing beyond read.
permissions:
  contents: read

jobs:
  test:
    name: go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    # Both steps finish in seconds; the GitHub default is 360 minutes, so a hang
    # would otherwise burn six hours before failing.
    timeout-minutes: 10
    strategy:
      # Report both legs independently — if the older toolchain breaks we want
      # to see that the newer one still passes, not have it cancelled.
      fail-fast: false
      matrix:
        # The floor is what go.mod requires; the ceiling is what local dev runs.
        # A released binary is built by scripts/build-release.sh, not here, so
        # this matrix is about the source staying buildable rather than about
        # which toolchain ships.
        go-version: ['1.22', 'stable']

    steps:
      # Pinned to first-party major tags rather than commit SHAs — a deliberate
      # choice, not a default. Major tags are mutable, so this trades exact
      # reproducibility for automatic security patches; `permissions: contents:
      # read` above bounds what a compromised action could reach. Switch to SHA
      # pins if third-party actions are ever added here.
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      # The two gates README.md designates, and they check different things.
      #
      # The SELF-TEST is the conformance instrument: it grades the binary
      # against the fixture corpus under examples/, which is what PROTOCOL.md
      # and schemas/open-test-intent.v1.json mean in practice. It is run from
      # bin/ so the binary resolves the in-repo schema and corpus rather than
      # its compiled-in fallbacks — this leg must fail on a checkout whose
      # fixtures are wrong, not pass against a copy of itself.
      - name: Fixture conformance (self-test)
        run: |
          go build -o bin/validate-intent ./cmd/validate-intent
          ./bin/validate-intent

      # The GO SUITE covers what a verdict cannot show: PROTOCOL.md §1.1
      # conformance clause by clause, the draft-07 keywords the shipped schema
      # does not declare, the glob's directory walk, and the encoders.
      #
      # `./...` and not `./cmd/...`: the SHA256 pin tying the embedded schema and
      # corpus to the files on disk lives in the root package, and narrowing the
      # pattern would drop it silently.
      - name: Go suite
        run: go test ./...
